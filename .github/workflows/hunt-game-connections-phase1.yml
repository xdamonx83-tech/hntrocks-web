name: Hunt game connections backend tests
on:
  push:
    branches:
      - feature/hunt-platform-connections-20261005
      - feature/hunt-xbox-ps-readiness-20261005
  workflow_dispatch:

jobs:
  steam-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked dependencies in CI
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Validate guarded release script syntax
        run: |
          bash -n scripts/deploy/hunt-game-connections-live-20261005.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path('scripts/deploy/hunt-game-connections-live-20261005.sh').read_text()
          snippets = s.split("<<'PY'\n")[1:]
          assert len(snippets) == 3, "Unexpected embedded Python section count"
          for index, piece in enumerate(snippets):
              code = piece.split("\nPY\n", 1)[0]
              compile(code, f"deployment embedded Python #{index + 1}", "exec")
          print("Bash and Python syntax OK")
          PY
      - name: Validate minimal Steam profile bridge
        run: |
          node --check scripts/deploy/assets/hunt-steam-profile-bridge.js
          bash -n scripts/deploy/hunt-steam-profile-bridge-20261005.sh
      - name: Validate normal-profile Steam widget
        run: |
          node --check scripts/deploy/assets/hunt-steam-profile-stats.js
          bash -n scripts/deploy/hunt-steam-normal-profile-20261005.sh
          bash -n scripts/deploy/hunt-steam-stats-tab-20261005.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path('scripts/deploy/hunt-steam-normal-profile-20261005.sh').read_text()
          for i, piece in enumerate(s.split("<<'PY'")[1:]):
              compile(piece.split("PY", 1)[0], f"normal profile #{i + 1}", "exec")
          PY
      - name: Hunt Steam tests (in-memory database, no live access)
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: |
          vendor/bin/phpunit tests/Feature/HuntSteamGameConnectionTest.php
          vendor/bin/phpunit tests/Feature/HuntXboxGameConnectionTest.php
