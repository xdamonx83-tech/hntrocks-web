name: Arcade Forfeit Verify

on:
  push:
    branches:
      - agent/live-arcade-match-forfeit

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hnt_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hnt_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env
      - run: php artisan key:generate --force
      - run: php artisan migrate --force
      - run: php artisan test tests/Feature/ArcadeMatchForfeitTest.php tests/Feature/ArcadeMemoryApiTest.php tests/Feature/ArcadeRankedStatsRewardsTest.php
      - run: php -l app/Services/Arcade/ArcadeMatchService.php && php -l app/Services/Arcade/ArcadeMatchResultProcessor.php && php -l app/Http/Controllers/Api/V1/Arcade/ArcadeMatchController.php && php -l app/Providers/ArcadeLifecycleRouteServiceProvider.php
