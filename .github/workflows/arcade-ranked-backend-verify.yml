name: Arcade Ranked Backend Verification

on:
  push:
    branches:
      - agent/arcade-ranked-stats-rewards
  workflow_dispatch:

jobs:
  arcade-ranked-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hnt_arcade_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hnt_arcade_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      CROWNS_ENABLED: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Install temporary test harness dependencies
        run: |
          composer require --dev phpunit/phpunit:^11.5 mockery/mockery:^1.6 --no-update --no-interaction
          composer update phpunit/phpunit mockery/mockery --with-all-dependencies --no-interaction --prefer-dist
          cat > tests/TestCase.php <<'PHP'
          <?php
          namespace Tests;
          abstract class TestCase extends \Illuminate\Foundation\Testing\TestCase {}
          PHP

      - name: PHP syntax checks
        run: |
          php -l app/Models/Arcade/ArcadeUserStat.php
          php -l app/Models/Arcade/ArcadeMatchFinalization.php
          php -l app/Models/Arcade/ArcadeMatchReward.php
          php -l app/Models/Arcade/ArcadeGame.php
          php -l app/Services/Arcade/ArcadeMatchResultProcessor.php
          php -l app/Services/Arcade/ArcadeMoveService.php
          php -l app/Http/Controllers/Api/V1/Arcade/ArcadeStatsController.php
          php -l app/Http/Requests/Admin/ArcadeGameRequest.php
          php -l app/Providers/ArcadeStatsRouteServiceProvider.php
          php -l database/migrations/2026_09_02_090000_create_arcade_stats_and_rewards_tables.php
          php -l tests/Feature/ArcadeRankedStatsRewardsTest.php

      - name: Run targeted Arcade tests
        run: |
          vendor/bin/phpunit \
            tests/Feature/ArcadeRankedStatsRewardsTest.php \
            tests/Feature/ArcadeGameCatalogApiTest.php \
            tests/Feature/ArcadeMatchApiTest.php \
            tests/Feature/ArcadeRealtimeTest.php \
            tests/Feature/ArcadeNotificationApiTest.php \
            tests/Unit/HuntWinsEngineTest.php
