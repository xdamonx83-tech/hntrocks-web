name: Arcade Memory Catalog Verification

on:
  push:
    branches:
      - agent/arcade-memory-catalog-acp
  workflow_dispatch:

jobs:
  arcade-memory-catalog:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hntrocks_test
          MYSQL_USER: hntrocks
          MYSQL_PASSWORD: hntrocks
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: phpunit:12

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp composer.json /tmp/composer.json.arcade-memory
          cp composer.lock /tmp/composer.lock.arcade-memory
          composer require --dev mockery/mockery:^1.6 fakerphp/faker:^1.24 --no-interaction

      - name: Prepare isolated test harness
        run: |
          php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' > .env
          cat > tests/TestCase.php <<'PHP'
          <?php
          namespace Tests;
          use Illuminate\Foundation\Testing\TestCase as BaseTestCase;
          abstract class TestCase extends BaseTestCase {}
          PHP

      - name: Memory catalog and Arcade regression tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hntrocks_test
          DB_USERNAME: hntrocks
          DB_PASSWORD: hntrocks
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log
        run: >-
          phpunit --bootstrap vendor/autoload.php
          tests/Feature/ArcadeGameCatalogApiTest.php
          tests/Unit/MemoryEngineTest.php
          tests/Unit/HuntWinsEngineTest.php
          tests/Feature/ArcadeMemoryApiTest.php
          tests/Feature/ArcadeMatchApiTest.php
          tests/Feature/ArcadeRealtimeTest.php
          tests/Feature/ArcadeNotificationApiTest.php
          tests/Feature/ArcadeRankedStatsRewardsTest.php

      - name: PHP syntax checks
        run: |
          php -l database/seeders/ArcadeGameSeeder.php
          php -l app/Http/Requests/Admin/ArcadeGameRequest.php
          php -l app/Http/Controllers/Admin/AdminArcadeGameController.php
          php -l tests/Feature/ArcadeGameCatalogApiTest.php
          php -l app/Services/Arcade/ArcadeGameEngineRegistry.php
          php -l app/Services/Arcade/Engines/MemoryEngine.php

      - name: Cleanup isolated harness and diff check
        if: always()
        run: |
          rm -f tests/TestCase.php .env
          cp /tmp/composer.json.arcade-memory composer.json
          cp /tmp/composer.lock.arcade-memory composer.lock
          git status --short
          git diff --check 5aee9fda8228ad08e8abb07ecb8a23f521d17f02 HEAD
