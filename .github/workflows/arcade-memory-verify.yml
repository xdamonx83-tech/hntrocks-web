name: Arcade Memory Backend Verification

on:
  push:
    branches:
      - agent/arcade-memory-engine
  workflow_dispatch:

jobs:
  arcade-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: phpunit:12

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp composer.json /tmp/composer.json.arcade-memory
          cp composer.lock /tmp/composer.lock.arcade-memory
          composer require --dev mockery/mockery:^1.6 --no-interaction

      - name: Prepare isolated test harness
        run: |
          php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' > .env
          touch database/database.sqlite
          cat > tests/TestCase.php <<'PHP'
          <?php
          namespace Tests;
          use Illuminate\Foundation\Testing\TestCase as BaseTestCase;
          abstract class TestCase extends BaseTestCase {}
          PHP

      - name: Memory engine and Arcade regression tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log
        run: >-
          phpunit --bootstrap vendor/autoload.php
          tests/Unit/MemoryEngineTest.php
          tests/Unit/HuntWinsEngineTest.php
          tests/Feature/ArcadeMemoryApiTest.php
          tests/Feature/ArcadeMatchApiTest.php
          tests/Feature/ArcadeRealtimeTest.php
          tests/Feature/ArcadeNotificationApiTest.php
          tests/Feature/ArcadeRankedStatsRewardsTest.php

      - name: PHP syntax checks
        run: |
          php -l app/Services/Arcade/Engines/ArcadeGameEngine.php
          php -l app/Services/Arcade/Engines/HuntWinsEngine.php
          php -l app/Services/Arcade/Engines/MemoryEngine.php
          php -l app/Services/Arcade/ArcadeGameEngineRegistry.php
          php -l app/Services/Arcade/ArcadeMoveService.php
          php -l app/Http/Resources/Api/ArcadeMatchResource.php
          php -l app/Http/Controllers/Api/V1/Arcade/ArcadeMatchController.php
          php -l app/Events/ArcadeMatchUpdated.php
          php -l tests/Unit/MemoryEngineTest.php
          php -l tests/Feature/ArcadeMemoryApiTest.php

      - name: Cleanup isolated harness and diff check
        if: always()
        run: |
          rm -f tests/TestCase.php .env database/database.sqlite
          cp /tmp/composer.json.arcade-memory composer.json
          cp /tmp/composer.lock.arcade-memory composer.lock
          git status --short
          git diff --check fed5a75e52c7fe05244aff43bfa2c98b204352c2 HEAD
