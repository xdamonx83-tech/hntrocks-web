name: Live Memory Ranked Integration Verification

on:
  push:
    branches:
      - agent/live-memory-ranked-integration-ready
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hntrocks_test
          MYSQL_USER: hntrocks
          MYSQL_PASSWORD: hntrocks
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: phpunit:12

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp composer.json /tmp/composer.json.arcade-ranked
          cp composer.lock /tmp/composer.lock.arcade-ranked
          composer require --dev mockery/mockery:^1.6 fakerphp/faker:^1.24 --no-interaction

      - name: Prepare isolated test harness
        run: |
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache
          php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' > .env
          cat > tests/TestCase.php <<'PHP'
          <?php
          namespace Tests;
          use Illuminate\Foundation\Testing\TestCase as BaseTestCase;
          abstract class TestCase extends BaseTestCase {}
          PHP

      - name: Ranked, Memory and Arcade regression tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hntrocks_test
          DB_USERNAME: hntrocks
          DB_PASSWORD: hntrocks
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log
        run: >-
          phpunit --bootstrap vendor/autoload.php
          tests/Feature/ArcadeRankedStatsRewardsTest.php
          tests/Feature/ArcadeGameCatalogApiTest.php
          tests/Feature/ArcadeMemoryApiTest.php
          tests/Feature/ArcadeInvitationApiTest.php
          tests/Feature/ArcadeMatchApiTest.php
          tests/Feature/ArcadeRealtimeTest.php
          tests/Feature/ArcadeNotificationApiTest.php
          tests/Unit/HuntWinsEngineTest.php
          tests/Unit/MemoryEngineTest.php

      - name: PHP syntax checks
        run: |
          php -l app/Http/Controllers/Api/V1/Arcade/ArcadeStatsController.php
          php -l app/Models/Arcade/ArcadeGame.php
          php -l app/Models/Arcade/ArcadeMatchFinalization.php
          php -l app/Models/Arcade/ArcadeMatchReward.php
          php -l app/Models/Arcade/ArcadeUserStat.php
          php -l app/Providers/ArcadeStatsRouteServiceProvider.php
          php -l app/Services/Arcade/ArcadeMatchResultProcessor.php
          php -l app/Services/Arcade/ArcadeMoveService.php
          php -l app/Services/Arcade/Engines/MemoryEngine.php
          php -l bootstrap/providers.php
          php -l database/migrations/2026_09_02_090000_create_arcade_stats_and_rewards_tables.php
          php -l tests/Feature/ArcadeRankedStatsRewardsTest.php
          php -l tests/Unit/MemoryEngineTest.php

      - name: Cleanup isolated harness and diff check
        if: always()
        run: |
          rm -f tests/TestCase.php .env
          cp /tmp/composer.json.arcade-ranked composer.json
          cp /tmp/composer.lock.arcade-ranked composer.lock
          git status --short
          git diff --check 59bf09fb44801759bda8d7784e7b2df671353fb0 HEAD
